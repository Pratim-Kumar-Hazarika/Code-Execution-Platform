# Registers gVisor as a pod runtime.
# Nodes must already have runsc + containerd configured (handler: runsc).
# This file alone does not install gVisor.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
# Smoke test after nodes have gVisor. Delete when it works.
# kubectl apply -f k8/gvisor.yaml
# kubectl logs job/gvisor-smoke
apiVersion: batch/v1
kind: Job
metadata:
  name: gvisor-smoke
spec:
  backoffLimit: 1
  template:
    spec:
      runtimeClassName: gvisor
      restartPolicy: Never
      containers:
        - name: smoke
          image: busybox:1.36
          command: ["sh", "-c", "echo gvisor-ok"]
